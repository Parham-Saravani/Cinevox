<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane | Cinevo</title>
</head>

<body class="bg-bg-primary font-poppins pb-1">
    <header>
        <section class="absolute z-30 top-5 left-0 right-0">
            <div class="container mx-auto">
                <div class="flex justify-between items-center">
                    <div class="flex items-center">
                        <a href="/" class="text-white font-bold text-2xl">Cinevo</a>
                        <ul class="max-sm:hidden flex gap-4 justify-between items-center ml-20">
                            <li
                                class="menu-item text-white hover:text-text-secondary transition-colors duration-300 text-sm font-normal relative">
                                <a href="#">Home</a>
                            </li>
                            <li
                                class="menu-item text-white hover:text-text-secondary transition-colors duration-300 text-sm font-normal relative">
                                <a href="#">Movies</a>
                            </li>
                            <li
                                class="menu-item text-white hover:text-text-secondary transition-colors duration-300 text-sm font-normal relative">
                                <a href="#">Series</a>
                            </li>
                            <li
                                class="menu-item text-white hover:text-text-secondary transition-colors duration-300 text-sm font-normal relative">
                                <a href="#">Genres</a>
                            </li>
                            <li
                                class="menu-item text-white hover:text-text-secondary transition-colors duration-300 text-sm font-normal relative">
                                <a href="#">New Releases</a>
                            </li>
                        </ul>
                    </div>
                    <div class="max-sm:hidden flex gap-10 items-center">
                        <div>
                            <input type="text"
                                class="w-90 text-text-secondary text-sm bg-input-bg py-3 px-4 rounded-full border-2 hover:border-input-border-hover focus:border-input-border-focus border-input-border outline-hidden transition-colors duration-300"
                                placeholder="Search for movies, series...">
                        </div>
                        <a
                            class="block w-34 text-center py-3 text-sm font-semibold bg-cta-primary hover:bg-cta-hover text-white transition-colors duration-300 rounded-xl cursor-pointer">Login
                            | Signup</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="h-190 max-xl:h-150 max-lg:h-140 max-md:h-100 max-sm:h-70 relative header-hero">
            <img class="blur-xs w-full h-full object-cover" src="./public/Images/Banners/Vikings.jpg" alt="">
            <div class="container mx-auto">
                <div class="absolute z-654546 top-0 bottom-0 my-auto h-fit">
                <img class="rounded-xl relative" src="./public/Images/Vikings.jpg" alt="">
                <div class="absolute top-0 h-full w-full bg-linear-180 from-transparent via-black/20 to-black z-10 rounded-xl"></div>
            </div>
            </div>
        </section>
    </header>

    <script type="module" src="./src/utilities/scripts/movie.js"></script>
</body>

</html>
